name: Keep Streamlit Alive

on:
  schedule:
    - cron: '0 * * * *' # Executa a cada 1 hora (no minuto 0 de cada hora)
  workflow_dispatch: # Permite testar manualmente a qualquer momento

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" https://fluxoderotas.streamlit.app/
